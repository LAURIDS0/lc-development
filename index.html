<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free FiveM scripts by LC Development.">
<title>LC Development</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- The same look as the docs: docs.css first, then what only this page needs -->
<link rel="stylesheet" href="docs/docs.css">
<link rel="stylesheet" href="styles.css">
<script>
    // Same theme as the docs, set before the page draws so it doesn't flash
    try { document.documentElement.dataset.theme = localStorage.getItem('lc_docs_theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body class="site">

<header class="navbar">
    <a class="brand" href="./"><img src="images/logo.png" alt="LC Development"><span>LC Development</span></a>
    <a class="nav-text active" href="./">Scripts</a>
    <a class="nav-text" href="docs/">Documentation</a>
    <a class="icon-btn" href="https://github.com/LAURIDS0" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="home">
    <section class="hero">
        <span class="badge released">Free</span>
        <h1>Free FiveM scripts</h1>
        <p>Scripts I have made over the years. Everything here is free to use, so grab what you need and give the repository a star on GitHub.</p>
        <div class="buttons">
            <a class="button primary" href="docs/"><i class="fa-solid fa-book"></i>Read the docs</a>
            <a class="button" href="https://github.com/LAURIDS0" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>GitHub</a>
        </div>
    </section>

    <section>
        <div class="section-head">
            <h2>Scripts</h2>
            <span class="count" id="count"></span>
        </div>
        <div class="scripts" id="scripts-grid"></div>
    </section>
</div>

<footer>Free FiveM scripts | LC Development</footer>

<!-- A script's README, opened from its card -->
<div class="search-overlay readme-overlay" id="readme">
    <div class="readme-box" role="dialog" aria-modal="true" aria-labelledby="readme-title">
        <div class="readme-head">
            <span id="readme-title"></span>
            <a class="button" id="readme-repo" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>Repository</a>
            <button class="icon-btn" id="readme-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <article class="readme" id="readme-body"></article>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="script.js"></script>
</body>
</html>
