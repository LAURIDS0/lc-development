<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Documentation for the free FiveM scripts by LC Development.">
<title>Documentation - LC Development</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="docs.css">
<script>
    // Set the theme before the page draws, so it doesn't flash
    try { document.documentElement.dataset.theme = localStorage.getItem('lc_docs_theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>

<header class="navbar">
    <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <a class="brand" href="#/"><img src="../images/logo.png" alt="">LC Development</a>
    <button class="search-btn" id="search-open" type="button"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span><kbd>Ctrl K</kbd></button>
    <a class="nav-text active" href="#/">Documentation</a>
    <a class="nav-text" href="../">Scripts</a>
    <a class="icon-btn" href="https://github.com/LAURIDS0" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="layout">
    <nav class="sidebar" id="sidebar"></nav>

    <main>
        <div id="pages"></div>
        <div class="page-footer" id="page-footer">
            <a class="edit" id="edit" href="https://github.com/LAURIDS0/lc-development" target="_blank" rel="noopener"><i class="fa-solid fa-pen-to-square"></i>Edit on GitHub</a>
            <nav class="pager" id="pager"></nav>
        </div>
    </main>

    <aside class="toc" id="toc"></aside>
</div>

<footer>Free FiveM scripts | LC Development</footer>

<div class="search-overlay" id="search">
    <div class="search-box" role="dialog" aria-label="Search">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input id="search-input" type="text" placeholder="Search all documentation" autocomplete="off"></div>
        <div class="results" id="results"></div>
    </div>
</div>

<script src="docs.js"></script>
</body>
</html>
